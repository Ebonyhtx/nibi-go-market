name: validate-market

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Leak gate
        run: node scripts/check-leaks.mjs
      - name: Scan package fixtures
        run: node --test scripts/scan-package.test.mjs
      - name: Validate submissions
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          MARKET_MAINTAINERS: Ebonyhtx
        run: node scripts/check-submissions.mjs
      - name: Validate yank log
        run: node scripts/check-yanks.mjs
      - name: Validate signed index and packages
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/validate.mjs --before "$BEFORE"
          else
            node scripts/validate.mjs
          fi

name: validate-market

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leak gate
        run: node scripts/check-leaks.mjs
      - name: Validate submissions
        run: node scripts/check-submissions.mjs
      - name: Validate yank log
        run: node scripts/check-yanks.mjs
      - name: Validate signed index and packages
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/validate.mjs --before "$BEFORE"
          else
            node scripts/validate.mjs
          fi
